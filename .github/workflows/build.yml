name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o projeto
        run: |
          f=$(ls *.zip DOC-* 2>/dev/null | head -n1)
          echo "Usando: $f"
          if [ -z "$f" ]; then echo "ERRO: não achei o zip do projeto na raiz do repositório"; ls -la; exit 1; fi
          unzip -q "$f" -d projeto
      - name: Descobrir qual Python o Chaquopy oferece com OpenCV para Android
        id: pick
        run: |
          curl -fsSL https://chaquo.com/pypi-13.1/opencv-python-headless/ -o idx.html || { echo "ERRO: não consegui abrir o catálogo do Chaquopy"; exit 1; }
          grep -o 'opencv_python_headless-[^"<>]*arm64_v8a[^"<>]*\.whl' idx.html | sort -u > wheels.txt || true
          echo "=== OpenCV para Android (arm64) disponível no Chaquopy ==="
          cat wheels.txt
          if [ ! -s wheels.txt ]; then echo "ERRO: nenhuma versão do OpenCV para Android no catálogo"; head -c 1500 idx.html; exit 1; fi
          minor=$(grep -o -- '-cp3[0-9]*-' wheels.txt | sed 's/-cp3//; s/-//' | sort -n | tail -1)
          echo "Python escolhido: 3.$minor"
          echo "pyver=3.$minor" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pick.outputs.pyver }}
      - name: Ajustar o projeto para esse Python
        run: |
          py=${{ steps.pick.outputs.pyver }}
          sed -i "s|version \"3.11\"|version \"$py\"\n        buildPython \"python$py\"|" projeto/app/build.gradle
          sed -i 's|install "opencv-python-headless".*|options "--only-binary=:all:"\n            install "opencv-python-headless"|' projeto/app/build.gradle
          sed -n '/chaquopy {/,/^}/p' projeto/app/build.gradle
          python$py --version
      - name: Descobrir a versão do Tesseract4Android (OCR) que existe
        run: |
          base=https://repo1.maven.org/maven2/cz/adaptech/tesseract4android/tesseract4android
          if curl -fsSL "$base/maven-metadata.xml" -o meta.xml; then
            echo "Versões no Maven Central:"; grep -o '<version>[^<]*</version>' meta.xml | sed 's/<[^>]*>//g' | tr '\n' ' '; echo
            v=$(grep -o '<release>[^<]*</release>' meta.xml | sed 's/<[^>]*>//g')
            if [ -z "$v" ]; then v=$(grep -o '<version>[^<]*</version>' meta.xml | sed 's/<[^>]*>//g' | tail -1); fi
            echo "Usando cz.adaptech.tesseract4android:tesseract4android:$v"
            sed -i "s|cz.adaptech.tesseract4android:tesseract4android:[0-9.]*|cz.adaptech.tesseract4android:tesseract4android:$v|" projeto/app/build.gradle
          else
            echo "Não está no Maven Central; tentando o JitPack"
            curl -fsSL https://jitpack.io/api/builds/com.github.adaptech-cz/Tesseract4Android -o jp.json || { echo "ERRO: nem Maven Central nem JitPack responderam"; exit 1; }
            echo "Versões prontas no JitPack:"; grep -o '"[0-9][0-9.]*" *: *"ok"' jp.json | sed 's/[" ]//g; s/:ok//' | tr '\n' ' '; echo
            coord=""; v=""
            for ver in 4.6.0 4.5.0 4.4.0 4.8.0 4.3.0; do
              if ! grep -q "\"$ver\" *: *\"ok\"" jp.json; then echo "$ver: não está pronta no JitPack"; continue; fi
              for opt in "com.github.adaptech-cz.Tesseract4Android:tesseract4android|com/github/adaptech-cz/Tesseract4Android/tesseract4android/$ver/tesseract4android-$ver.pom" "com.github.adaptech-cz:Tesseract4Android|com/github/adaptech-cz/Tesseract4Android/$ver/Tesseract4Android-$ver.pom"; do
                c=${opt%%|*}; path=${opt##*|}
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "https://jitpack.io/$path")
                echo "$c:$ver -> HTTP $code"
                if [ "$code" = "200" ]; then coord="$c"; v="$ver"; break 2; fi
              done
            done
            if [ -z "$coord" ]; then echo "ERRO: nenhuma versão do Tesseract4Android disponível no JitPack"; exit 1; fi
            echo "Usando $coord:$v (JitPack)"
            sed -i "s|'cz.adaptech.tesseract4android:tesseract4android:[0-9.]*'|'$coord:$v'|" projeto/app/build.gradle
            sed -i 's|maven { url "https://chaquo.com/maven" }|maven { url "https://chaquo.com/maven" }\n        maven { url "https://jitpack.io" }|' projeto/settings.gradle
          fi
          grep -n -i tesseract projeto/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Compilar
        working-directory: projeto
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: projeto/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar também como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MirageHunter-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
