name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o projeto
        run: |
          f=$(ls *.zip DOC-* 2>/dev/null | head -n1)
          echo "Usando: $f"
          if [ -z "$f" ]; then echo "ERRO: não achei o zip do projeto na raiz do repositório"; ls -la; exit 1; fi
          unzip -q "$f" -d projeto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mandar o Chaquopy usar o Python 3.11
        run: |
          sed -i 's|version "3.11"|version "3.11"\n        buildPython "python3.11"|' projeto/app/build.gradle
          grep -n "buildPython" projeto/app/build.gradle
          python3.11 --version
      - name: Pacotes Python (só versões prontas para Android)
        run: |
          sed -i 's|install "opencv-python-headless".*|options "--only-binary=:all:"\n            install "opencv-python-headless"|' projeto/app/build.gradle
          sed -n '/chaquopy {/,/^}/p' projeto/app/build.gradle
          echo "--- opencv disponível no repositório do Chaquopy:"
          curl -s https://chaquo.com/pypi-13.1/opencv-python-headless/ | grep -o 'opencv_python_headless[^"<>]*arm64_v8a[^"<>]*' | sort -u | head -40 || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Compilar
        working-directory: projeto
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: projeto/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar também como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MirageHunter-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
